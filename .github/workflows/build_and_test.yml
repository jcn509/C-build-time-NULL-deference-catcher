name: CMake Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  linux-tests:
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
      fail-fast: false
    
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang cmake llvm ninja-build
    
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
          -DCMAKE_C_COMPILER=${{matrix.cc}} \
          -DCMAKE_CXX_COMPILER=${{matrix.cxx}} \
          -G Ninja
      
    - name: Build
      run: |
        cmake --build ${{github.workspace}}/build --parallel
      
    - name: Test
      run: |
        cd ${{github.workspace}}/build
        ctest --output-on-failure
  
  linux-sanitizers:
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
      fail-fast: false
    
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang cmake llvm ninja-build
    
    - name: Configure CMake with sanitizers
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=${{matrix.cc}} \
          -DCMAKE_CXX_COMPILER=${{matrix.cxx}} \
          -DUSE_SANITIZERS=ON \
          -DSANITIZER_ADDRESS=ON \
          -DSANITIZER_UNDEFINED=ON \
          -G Ninja
      
    - name: Build with sanitizers
      run: |
        cmake --build ${{github.workspace}}/build --parallel
      
    - name: Test with sanitizers
      env:
        # Environment variables for sanitizers
        ASAN_OPTIONS: "detect_leaks=1"
        UBSAN_OPTIONS: "print_stacktrace=1"
      run: |
        cd ${{github.workspace}}/build
        ctest --output-on-failure
  
  windows-tests:
    strategy:
      matrix:
        build_type: [Debug, Release]
      fail-fast: false
    
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}}
      
    - name: Build
      run: |
        cmake --build ${{github.workspace}}/build --config ${{matrix.build_type}} --parallel
      
    - name: Test
      run: |
        cd ${{github.workspace}}/build
        ctest --output-on-failure 
